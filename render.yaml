databases:
  - name: Omarlhlbwy7
    databaseName: omarlhlbwy7
    user: omarlhlbwy7_user
    region: oregon
    plan: free

services:
  - type: web
    name: dtr1-n
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn -c gunicorn.conf.py main:app"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: Omarlhlbwy7
          property: connectionString
      - key: RENDER_SERVICE_NAME
        value: dtr1-n
      - key: GEMINI_API_KEY
        sync: false
